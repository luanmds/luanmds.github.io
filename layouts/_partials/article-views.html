{{ if .Site.Params.goatcounter.code }}
<div class="article-views flex justify-center text-center text-sm text-neutral-500 dark:text-neutral-400 pb-4 mb-4 border-b border-dotted border-neutral-300 dark:border-neutral-600 print:hidden">
  <span id="goatcounter-views" class="flex items-center gap-1" title="{{ if eq .Lang "pt" }}Visualizações da página{{ else }}Page views{{ end }}">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
    </svg>
    <span class="views-count transition-opacity duration-300 opacity-50">—</span> 
    <span>{{ if eq .Lang "pt" }}visualizações{{ else }}views{{ end }}</span>
  </span>
</div>

<script>
  (function() {
    var path = location.pathname.replace(/^\//, '').replace(/\/$/, '');
    var code = "{{ .Site.Params.goatcounter.code }}";
    if (!code) return;

    // Goatcounter API endpoint para views da página
    // O path é armazenado sem barras inicial/final (ex: "posts/meu-artigo")
    var url = 'https://' + code + '.goatcounter.com/counter/' + path + '.json';
    
    fetch(url)
      .then(function(res) {
        if (!res.ok) throw new Error('Network response was not ok');
        return res.json();
      })
      .then(function(data) {
        if (data && data.count !== undefined) {
          var countStr = parseInt(data.count).toLocaleString('{{ if eq .Lang "pt" }}pt-BR{{ else }}en-US{{ end }}');
          var countEl = document.querySelector('#goatcounter-views .views-count');
          if (countEl) {
            countEl.textContent = countStr;
            countEl.classList.remove('opacity-50');
            countEl.classList.add('opacity-100');
          }
        }
      })
      .catch(function(err) {
        // Se falhar (ex: adblock, CORS), mantemos o traço e evitamos poluir o console para o usuário
        console.debug('Goatcounter API request blocked or failed.');
      });
  })();
</script>
{{ end }}
